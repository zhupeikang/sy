    <script>
        LA.init({id:"JvqJHsEqvz6JkKPM",ck:"JvqJHsEqvz6JkKPM",autoTrack:true})

        function showToast(msg) {
            layer.msg(msg, {
                icon: 4,
                offset: '50vh',
            })

        }
        function scrollIntoView(traget) {
            var tragetElem = document.querySelector(traget);
            var tragetElemPostition = tragetElem.offsetTop;

            // 判断是否支持新特性
            if (
                typeof window.getComputedStyle(document.body).scrollBehavior ==
                "undefined"
            ) {
                // 当前滚动高度
                var scrollTop =
                    document.documentElement.scrollTop || document.body.scrollTop;
                // 滚动step方法
                var step = function () {
                    // 距离目标滚动距离
                    var distance = tragetElemPostition - scrollTop;

                    // 目标需要滚动的距离，也就是只走全部距离的五分之一
                    scrollTop = scrollTop + distance / 5;
                    if (Math.abs(distance) < 1) {
                        window.scrollTo(0, tragetElemPostition);
                    } else {
                        window.scrollTo(0, scrollTop);
                        setTimeout(step, 20);
                    }
                };
                step();
            } else {
                tragetElem.scrollIntoView({
                    behavior: "smooth",
                    inline: "nearest"
                });
            }
        }

        layui.use(['layer'], function () {
            var $ = layui.jquery
            //通过get中获取from参数
            var from = getQueryString('from');
            if (!from) from = '';
            //判断from参数是否存在
            // LA.track('cqxsds', {'action':'index', 'from':from});
            if (from) {
                //判断from参数是否为sign
                console.log(from)
                //修改报名链接
                $('#sign-link').attr('href', 'sign.html?from=' + from)
            }

        })

        //获取get参数
        function getQueryString(name) {
            //获取url中的参数
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
            //获取url中的参数
            var r = window.location.search.substr(1).match(reg);
            //判断参数是否存在
            if (r != null) {
                //返回参数
                return unescape(r[2]);
            }
            //返回空
            return null;
        }
    </script>
